[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire_kg_api"
version = "0.1.0"
description = "Wildfire Knowledge Graph API with LangGraph integration"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Blake Crowther", email = "blakecrowther@gmail.com"}
]

dependencies = [
    # FastAPI and server
    "fastapi==0.115.11",
    "uvicorn==0.34.0",
    "pydantic==2.10.6",
    
    # LangChain Core and Integrations
    "langchain==0.3.25",
    "langchain-community==0.3.18",
    "langchain-openai==0.3.7",
    "langchain-core==0.3.59",
    "langchain-tavily==0.1.6",
    
    # LangGraph
    "langgraph==0.3.27",
    "langsmith==0.3.11",
    
    # Utilities
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "click==8.1.8",
    "psutil==5.9.8",
    
    # Other Tools
    "openai==1.65.2",
    "tavily-python==0.5.1",
    "rdflib==7.1.3",
    "duckduckgo-search==8.0.2",
    
    # AWS
    "boto3==1.37.4",
    "botocore==1.37.4",
]

# Add command-line entry points
[project.scripts]
wkg-api = "wildfire_kg_api.main:cli"

[project.optional-dependencies]
dev = [
    # Development tools
    "black>=24.2.0",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    
    # Evaluation
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
    "pandas==2.2.3",
    
    # Documentation
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.9",
    
    # LangGraph Development Tools
    "langgraph-cli==0.1.74",
    "langgraph-api==0.0.27",
    "langgraph-sdk==0.1.53",
    "langgraph-checkpoint==2.0.16",
    "langgraph-prebuilt==0.1.1",
]

# Development tool configurations
[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88
      context: "Aspect (LF_ASP) is a property of FireBehaviorMetrics. To access it, you need to use hasFireBehaviorMetrics to get from the plot to the metrics."
      example_query: "What is the aspect for plot_CASBC_0011_20240913_1?"
      example_sparql: |

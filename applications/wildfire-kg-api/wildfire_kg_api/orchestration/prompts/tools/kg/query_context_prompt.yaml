    tree_shrub_question:
      context: "Tree and shrub metrics are properties of TreeShrubMetrics. To access them, you need to use hasTreeShrubMetrics to get from the plot to the metrics."
      example_query: "How many trees are in plot_CASBC_0011_20240913_1?"
      example_sparql: |
        PREFIX wifire: <http://wifire.ucsd.edu/ontology/>
        SELECT ?treeCount
        WHERE {{
            wifire:plot_CASBC_0011_20240913_1 wifire:hasTreeShrubMetrics ?treeShrubMetrics .
            ?treeShrubMetrics wifire:TreesN ?treeCount .
        }}
    
    vegetation_question:
      context: "Vegetation metrics are properties of VegetationMetrics. To access them, you need to use hasVegetationMetrics to get from the plot to the metrics."

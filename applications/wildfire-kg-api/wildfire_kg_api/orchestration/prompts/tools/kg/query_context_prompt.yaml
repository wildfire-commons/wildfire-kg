            ?vegetationMetrics wifire:LAI ?lai .
        }}
    
    prescribed_burn_impact_question:
      context: |
        To assess the impact of the last prescribed burn for a plot prefix (e.g., "CASBC_0012"):
        1. Use STRSTARTS on plotName to find all plots whose names start with the prefix
        2. For those plots, get plotDate and select the one with the latest date (ORDER BY DESC(plotDate) LIMIT 1)
        3. Use lastMetrics to get the previous plot
        4. For both plots, use the relationships to get metrics:
           - hasTreeShrubMetrics for tree/shrub data
           - hasVegetationMetrics for vegetation data
           - hasFireBehaviorMetrics for fire behavior data
        5. Compare specific properties between plots using OPTIONAL blocks
      example_query: "What was the impact of the last prescribed burn at CASBC_0012?"
      example_sparql: |
        PREFIX wifire: <http://wifire.ucsd.edu/ontology/>
        
        SELECT ?metric ?beforeValue ?afterValue
        WHERE {{
          # Get latest plot
          {{
            SELECT ?afterPlot
            WHERE {{
              ?afterPlot wifire:plotName ?plotName .
              FILTER(STRSTARTS(?plotName, "CASBC_0012"))
              ?afterPlot wifire:plotDate ?afterDate .
            }}
            ORDER BY DESC(?afterDate)
            LIMIT 1
          }}
          
          # Get previous plot
          ?afterPlot wifire:lastMetrics ?beforePlot .
          
          # TreeShrubMetrics comparison
          ?afterPlot wifire:hasTreeShrubMetrics ?afterTreeShrub .
          ?beforePlot wifire:hasTreeShrubMetrics ?beforeTreeShrub .
          OPTIONAL {{
            ?afterTreeShrub wifire:TreesN ?afterValue .
            ?beforeTreeShrub wifire:TreesN ?beforeValue .
            BIND("Tree Count" AS ?metric)
          }}
          OPTIONAL {{
            ?afterTreeShrub wifire:ShrubsN ?afterValue .
            ?beforeTreeShrub wifire:ShrubsN ?beforeValue .
            BIND("Shrub Count" AS ?metric)
          }}
          OPTIONAL {{
            ?afterTreeShrub wifire:MeanSH ?afterValue .
            ?beforeTreeShrub wifire:MeanSH ?beforeValue .
            BIND("Mean Shrub Height" AS ?metric)
          }}
          OPTIONAL {{
            ?afterTreeShrub wifire:MaxSH ?afterValue .
            ?beforeTreeShrub wifire:MaxSH ?beforeValue .
            BIND("Max Shrub Height" AS ?metric)
          }}
          OPTIONAL {{
            ?afterTreeShrub wifire:MeanSA ?afterValue .
            ?beforeTreeShrub wifire:MeanSA ?beforeValue .
            BIND("Mean Shrub Area" AS ?metric)
          }}
          OPTIONAL {{
            ?afterTreeShrub wifire:shrubArea ?afterValue .
            ?beforeTreeShrub wifire:shrubArea ?beforeValue .
            BIND("Total Shrub Area" AS ?metric)
          }}
          OPTIONAL {{
            ?afterTreeShrub wifire:LF_CBD ?afterValue .
            ?beforeTreeShrub wifire:LF_CBD ?beforeValue .
            BIND("Canopy Bulk Density" AS ?metric)
          }}
          OPTIONAL {{
            ?afterTreeShrub wifire:MeanSD ?afterValue .
            ?beforeTreeShrub wifire:MeanSD ?beforeValue .
            BIND("Mean Stem Density" AS ?metric)
          }}

          # VegetationMetrics comparison
          ?afterPlot wifire:hasVegetationMetrics ?afterVeg .
          ?beforePlot wifire:hasVegetationMetrics ?beforeVeg .
          OPTIONAL {{
            ?afterVeg wifire:LAI ?afterValue .
            ?beforeVeg wifire:LAI ?beforeValue .
            BIND("Leaf Area Index" AS ?metric)
          }}
          OPTIONAL {{
            ?afterVeg wifire:basalArea ?afterValue .
            ?beforeVeg wifire:basalArea ?beforeValue .
            BIND("Basal Area" AS ?metric)
          }}
          OPTIONAL {{
            ?afterVeg wifire:TBA ?afterValue .
            ?beforeVeg wifire:TBA ?beforeValue .
            BIND("Total Basal Area" AS ?metric)
          }}

          # FireBehaviorMetrics comparison
          ?afterPlot wifire:hasFireBehaviorMetrics ?afterFB .
          ?beforePlot wifire:hasFireBehaviorMetrics ?beforeFB .
          OPTIONAL {{
            ?afterFB wifire:LF_FBFM13 ?afterValue .
            ?beforeFB wifire:LF_FBFM13 ?beforeValue .
            BIND("Fuel Model 13" AS ?metric)
          }}
          OPTIONAL {{
            ?afterFB wifire:LF_FBFM40 ?afterValue .
            ?beforeFB wifire:LF_FBFM40 ?beforeValue .
            BIND("Fuel Model 40" AS ?metric)
          }}
          OPTIONAL {{
            ?afterFB wifire:LF_EVC ?afterValue .
            ?beforeFB wifire:LF_EVC ?beforeValue .
            BIND("Expected Vegetation Cover" AS ?metric)
          }}
          OPTIONAL {{
            ?afterFB wifire:LF_EVT ?afterValue .
            ?beforeFB wifire:LF_EVT ?beforeValue .
            BIND("Expected Vegetation Type" AS ?metric)
          }}
        }} 
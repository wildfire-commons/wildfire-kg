###############################################################################
# DEV Neo4j Helm values 
#
# The full list of values can be found here:
# 
###############################################################################

# Neo4j Configuration
neo4j:
  nameOverride: "neo4j-dev"
  namespace: "wifire-kg"
  
  # Deployment configuration
  replicas: 1
  
  # Image configuration
  image:
    repository: neo4j
    tag: "5.11.0"
    pullPolicy: IfNotPresent
  
  # Container configuration
  ports:
    http: 7474
    bolt: 7687
  
  # Environment variables
  env:
    NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    NEO4J_server_config_strict__validation_enabled: "false"
  
  # Authentication
  auth:
    enabled: true
    username: "neo4j"
    password: "password123"
  
  # Persistence configuration
  persistence:
    enabled: true
    storageClass: "rook-ceph-block-south-east"
    size: "10Gi"
    accessMode: "ReadWriteOnce"
  
  # Service configuration
  service:
    type: LoadBalancer
    ports:
      http:
        port: 7474
        targetPort: 7474
      bolt:
        port: 7687
        targetPort: 7687


###############################################################################
# DEV Supabase Helm values 
#
# The full list of values can be found here:
# https://github.com/supabase/helm-charts/blob/main/charts/supabase/values.yaml
###############################################################################

##########################
# Global Configurations  #
##########################

global:
  # Supabase credentials
  credentials:
    database:
      username: postgres
      password: your-secure-password
    anon_key: your-anon-key
    service_role_key: your-service-role-key
    jwt_secret: your-jwt-secret

##########################
# Database Configuration #
##########################

db:
  replicas: 1
  resources:
    limits:
      memory: 4Gi
      cpu: 1
    requests:
      memory: 2Gi
      cpu: 500m
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "rook-ceph-block"

##########################
# Studio Configuration  #
##########################

studio:
  enabled: true
  ingress:
    enabled: true
    className: haproxy
    annotations: {}
    host: supabase-studio-dev-wildfire-kg.nrp-nautilus.io
    tls:
      enabled: true
      secretName: supabase-studio-dev-tls

##########################
# API Configuration     #
##########################

api:
  enabled: true
  ingress:
    enabled: true
    className: haproxy
    annotations: {}
    host: supabase-api-dev-wildfire-kg.nrp-nautilus.io
    tls:
      enabled: true
      secretName: supabase-api-dev-tls

##########################
# Auth Configuration    #
##########################

auth:
  enabled: true
  resources:
    limits:
      memory: 1Gi
      cpu: 500m
    requests:
      memory: 512Mi
      cpu: 250m

##########################
# Storage Configuration #
##########################

storage:
  enabled: true
  resources:
    limits:
      memory: 1Gi
      cpu: 500m
    requests:
      memory: 512Mi
      cpu: 250m
  persistence:
    enabled: true
    size: 100Gi
    storageClass: "rook-ceph-block"

##########################
# Meta Configuration    #
##########################

meta:
  enabled: true
  resources:
    limits:
      memory: 512Mi
      cpu: 250m
    requests:
      memory: 256Mi
      cpu: 100m 
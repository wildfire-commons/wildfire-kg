apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  namespace: wifire-kg
data:
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
  AIRFLOW__CELERY__RESULT_BACKEND: "db+postgresql://airflow:airflow@postgres:5432/airflow"
  AIRFLOW__CELERY__BROKER_URL: "redis://redis:6379/0"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__EXECUTOR: "CeleryExecutor"
  AIRFLOW__WEBSERVER__SECRET_KEY: "your-secret-key-here"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
  AIRFLOW__WEBSERVER__WORKERS: "2"
  AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags"
  AIRFLOW__CORE__FERNET_KEY: "your-fernet-key-here"
  AIRFLOW__CELERY__DEFAULT_POOL_SIZE: "128"
  AIRFLOW__CORE__DEFAULT_POOL_SLOTS: "128"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: wifire-kg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox
          command: ['sh', '-c', 'until nc -z postgres 5432 && nc -z redis 6379; do echo waiting for dependencies; sleep 2; done']
        - name: init-airflow
          image: apache/airflow:latest
          command: ['bash', '-c']
          args:
            - |
              airflow db init
              sleep 5
              if ! airflow users list | grep -q "admin"; then
                airflow users create \
                  --username admin \
                  --password admin \
                  --firstname admin \
                  --lastname admin \
                  --role Admin \
                  --email nischerer@ucsd.edu
              fi
              airflow pools set default_pool 128 "Default pool"
          envFrom:
            - configMapRef:
                name: airflow-config
      containers:
        - name: airflow-webserver
          image: apache/airflow:latest
          args: ["webserver"]
          envFrom:
            - configMapRef:
                name: airflow-config
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: dags-volume
              mountPath: /opt/airflow/dags
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            timeoutSeconds: 5
            periodSeconds: 10

        - name: git-sync
          image: k8s.gcr.io/git-sync/git-sync:v3.6.3
          securityContext:
            runAsUser: 50000
          env:
            - name: GIT_SYNC_REPO
              value: "https://github.com/wildfire-commons/wildfire-kg.git"
            - name: GIT_SYNC_BRANCH
              value: "dev"
            - name: GIT_SYNC_ROOT
              value: "/opt/airflow/dags"
            - name: GIT_SYNC_DEST
              value: "."
            - name: GIT_SYNC_PERIOD
              value: "60"
            - name: GIT_SYNC_MAX_SYNC_FAILURES
              value: "0"
          volumeMounts:
            - name: dags-volume
              mountPath: /opt/airflow/dags
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

      volumes:
        - name: dags-volume
          emptyDir: {}

---

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

        - name: git-sync
          image: k8s.gcr.io/git-sync/git-sync:v3.6.3
          securityContext:
            runAsUser: 50000
          env:
            - name: GIT_SYNC_REPO
              value: "https://github.com/wildfire-commons/wildfire-kg.git"
            - name: GIT_SYNC_BRANCH
              value: "dev"
            - name: GIT_SYNC_ROOT
              value: "/opt/airflow/dags"
            - name: GIT_SYNC_DEST
              value: "."
            - name: GIT_SYNC_PERIOD
              value: "60"
            - name: GIT_SYNC_MAX_SYNC_FAILURES
              value: "0"
          volumeMounts:
            - name: dags-volume
              mountPath: /opt/airflow/dags
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

      volumes:
        - name: dags-volume
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-worker
  namespace: wifire-kg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-worker
  template:
    metadata:
      labels:
        app: airflow-worker
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox
          command: ['sh', '-c', 'until nc -z postgres 5432 && nc -z redis 6379; do echo waiting for dependencies; sleep 2; done']
      containers:
        - name: airflow-worker
          image: apache/airflow:latest
          args: ["celery", "worker"]
          envFrom:
            - configMapRef:
                name: airflow-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: dags-volume
              mountPath: /opt/airflow/dags
            - name: data-volume
              mountPath: /opt/airflow/data

        - name: git-sync
          image: k8s.gcr.io/git-sync/git-sync:v3.6.3
          securityContext:
            runAsUser: 50000
          env:
            - name: GIT_SYNC_REPO
              value: "https://github.com/wildfire-commons/wildfire-kg.git"
            - name: GIT_SYNC_BRANCH
              value: "dev"
            - name: GIT_SYNC_ROOT
              value: "/opt/airflow/dags"
            - name: GIT_SYNC_DEST
              value: "."
            - name: GIT_SYNC_PERIOD
              value: "60"
            - name: GIT_SYNC_MAX_SYNC_FAILURES
              value: "0"
          volumeMounts:
            - name: dags-volume
              mountPath: /opt/airflow/dags
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

      volumes:
        - name: dags-volume
          emptyDir: {}
        - name: data-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: wifire-kg
spec:
  type: ClusterIP
  selector:
    app: airflow-webserver
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airflow-ingress
  namespace: wifire-kg
  annotations:
    kubernetes.io/ingress.class: haproxy
spec:
  rules:
  - host: wifire-kg-airflow.nrp-nautilus.io
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: airflow-webserver
            port:
              number: 8080
  tls:
  - hosts:
    - wifire-kg-airflow.nrp-nautilus.io
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wildfire-kg-frontend-ENV_PLACEHOLDER
  labels:
    app: wildfire-kg-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wildfire-kg-frontend
  template:
    metadata:
      labels:
        app: wildfire-kg-frontend
    spec:
      containers:
      - name: frontend
        image: gitlab-registry.nrp-nautilus.io/wildfire-kg/wildfire-kg/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            memory: "256Mi"
        env:
          - name: NEXT_PUBLIC_API_URL
            value: "https://langgraph-ENV_PLACEHOLDER-wifire-kg.nrp-nautilus.io"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: frontend-secrets
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: frontend-secrets
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_DEFAULT_REGION
            valueFrom:
              secretKeyRef:
                name: frontend-secrets
                key: AWS_DEFAULT_REGION
          - name: AWS_S3_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: frontend-secrets
                key: AWS_S3_ENDPOINT_URL
          - name: AWS_S3_BUCKET_NAME
            valueFrom:
              secretKeyRef:
                name: frontend-secrets
                key: AWS_S3_BUCKET_NAME
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: wildfire-kg-frontend-ENV_PLACEHOLDER
  labels:
    app: wildfire-kg-frontend
spec:
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: wildfire-kg-frontend
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wildfire-kg-frontend-ENV_PLACEHOLDER
  annotations:
    kubernetes.io/ingress.class: haproxy
    haproxy.router.openshift.io/timeout: 60s
spec:
  rules:
  - host: wildfire-ENV_PLACEHOLDER.nrp-nautilus.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wildfire-kg-frontend-ENV_PLACEHOLDER
            port:
              number: 80
  tls:
  - hosts:
    - wildfire-ENV_PLACEHOLDER.nrp-nautilus.io

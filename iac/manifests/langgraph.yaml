apiVersion: v1
kind: ConfigMap
metadata:
  name: langgraph-config
data:
  langgraph.json: |
    {
      "host": "0.0.0.0",
      "port": 8000,
      "log_level": "info",
      "workers": 4,
      "timeout": 300,
      "max_requests": 1000,
      "max_requests_jitter": 50
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langgraph-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langgraph-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langgraph-postgres
  template:
    metadata:
      labels:
        app: langgraph-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langgraph-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "postgres"
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: langgraph-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: langgraph-postgres
spec:
  type: ClusterIP
  selector:
    app: langgraph-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langgraph-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langgraph-redis
  template:
    metadata:
      labels:
        app: langgraph-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          startupProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: langgraph-redis
spec:
  type: ClusterIP
  selector:
    app: langgraph-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langgraph
  namespace: wifire-kg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langgraph
  template:
    metadata:
      labels:
        app: langgraph
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox
          command: ['sh', '-c', 'until nc -z langgraph-postgres 5432 && nc -z langgraph-redis 6379; do echo waiting for dependencies; sleep 2; done']
      containers:
      - name: langgraph
        image: gitlab-registry.nrp-nautilus.io/wildfire-kg/wildfire-kg:langgraph-ENV_PLACEHOLDER
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        env:
        - name: LANGGRAPH_HOST
          value: "0.0.0.0"
        - name: LANGGRAPH_PORT
          value: "8000"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: OPENAI_API_KEY
        - name: REDIS_URI
          value: "redis://langgraph-redis:6379/0"
        - name: DATABASE_URI
          value: "postgres://postgres:$(POSTGRES_PASSWORD)@langgraph-postgres:5432/postgres?sslmode=disable"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: POSTGRES_PASSWORD
        - name: LANGGRAPH_CONFIG_PATH
          value: "/app/config/langgraph.json"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT_URL
          value: "https://s3-west.nrp-nautilus.io"
        - name: AWS_S3_BUCKET_NAME
          value: "wildfire-kg"
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: AWS_DEFAULT_REGION
        - name: GRAPHDB_URL
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: GRAPHDB_URL
        - name: GRAPHDB_REPOSITORY
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: GRAPHDB_REPOSITORY
        - name: GRAPHDB_USERNAME
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: GRAPHDB_USERNAME
        - name: GRAPHDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: GRAPHDB_PASSWORD
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: TAVILY_API_KEY
        - name: DEBUG
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: DEBUG
        - name: LOG_LEVEL
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: LOG_LEVEL
        - name: LANGCHAIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: langgraph-secrets
              key: LANGCHAIN_API_KEY
        - name: LANGCHAIN_TRACING_V2
          value: "true"
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Starting FastAPI server..."
            uvicorn wildfire_kg_api.app:app --host 0.0.0.0 --port 8000 --workers 4
        volumeMounts:
        - name: langgraph-data
          mountPath: /data
        - name: langgraph-config
          mountPath: /app/config
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: langgraph-data
        emptyDir: {}
      - name: langgraph-config
        configMap:
          name: langgraph-config
---
apiVersion: v1
kind: Service
metadata:
  name: langgraph
  namespace: wifire-kg
spec:
  type: ClusterIP
  selector:
    app: langgraph
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langgraph-ingress
  namespace: wifire-kg
  annotations:
    kubernetes.io/ingress.class: haproxy
    haproxy.router.openshift.io/timeout: 60s
spec:
  rules:
  - host: langgraph-ENV_PLACEHOLDER-wifire-kg.nrp-nautilus.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: langgraph
            port:
              number: 8000
  tls:
  - hosts:
    - langgraph-ENV_PLACEHOLDER-wifire-kg.nrp-nautilus.io

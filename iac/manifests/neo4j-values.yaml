neo4j:
  name: wifire-kg-neo4j
  edition: community
  acceptLicenseAgreement: "yes"
  
  # Standalone deployment
  standalone: true
  core:
    standalone: true
    
  # Resources configuration
  resources:
    core:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "4"
        memory: "8Gi"

  # Neo4j configuration
  config:
    dbms.security.auth_enabled: "true"
    dbms.connectors.default_listen_address: "0.0.0.0"
    dbms.connector.bolt.advertised_address: "wifire-kg-neo4j.nrp-nautilus.io:7687"
    dbms.connector.http.advertised_address: "wifire-kg-neo4j.nrp-nautilus.io:7474"
    dbms.connector.https.advertised_address: "wifire-kg-neo4j.nrp-nautilus.io:7473"

  # Services configuration
  services:
    neo4j:
      spec:
        type: ClusterIP
        ports:
          - name: http
            port: 7474
            targetPort: 7474
          - name: https
            port: 7473
            targetPort: 7473
          - name: bolt
            port: 7687
            targetPort: 7687

# Volume configuration - fixed storage requests
volumes:
  data:
    mode: defaultStorageClass
    defaultStorageClass:
      requests:
        storage: 100Gi
  logs:
    mode: defaultStorageClass
    defaultStorageClass:
      requests:
        storage: 10Gi
  plugins:
    mode: defaultStorageClass
    defaultStorageClass:
      requests:
        storage: 1Gi
  metrics:
    mode: defaultStorageClass
    defaultStorageClass:
      requests:
        storage: 1Gi
  import:
    mode: defaultStorageClass
    defaultStorageClass:
      requests:
        storage: 10Gi

# Ingress configuration
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: haproxy
  hosts:
    - host: wifire-kg-neo4j.nrp-nautilus.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: neo4j-tls-cert
      hosts:
        - wifire-kg-neo4j.nrp-nautilus.io
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: wifire-kg
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
      - name: neo4j
        image: neo4j:5.26.2
        ports:
        - containerPort: 7474
          name: http
        - containerPort: 7687
          name: bolt
        env:
        - name: NEO4J_AUTH
          value: neo4j/$zajf9s9eDOLECntRxK5Mded
        - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
          value: "yes"
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
          limits:
            cpu: "2"
            memory: "8Gi"
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 100Gi

---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: wifire-kg
spec:
  type: ClusterIP
  selector:
    app: neo4j
  ports:
  - port: 7474
    targetPort: 7474
    name: http
  - port: 7687
    targetPort: 7687
    name: bolt

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neo4j-ingress
  namespace: wifire-kg
  annotations:
    kubernetes.io/ingress.class: haproxy
spec:
  rules:
  - host: wifire-kg-neo4j.nrp-nautilus.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: neo4j
            port:
              number: 7474
  tls:
  - hosts:
    - wifire-kg-neo4j.nrp-nautilus.io 